name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: metis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # NOTE: tests/foundation honours METIS_TEST_PG_URI (CI Postgres). tests/db and tests/security still use
      # the embedded pgserver fixture (integrator-owned); switch them to this env var when convenient.
      METIS_TEST_PG_URI: postgresql://postgres:ci-only-not-a-secret@localhost:5432/metis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend/core tests/foundation
      - run: ruff format --check backend/core tests/foundation
      - run: mypy
      - run: bandit -c pyproject.toml -r backend
      - run: pip-audit -r requirements.txt
      - name: Baseline migration against Postgres (idempotent re-run)
        run: |
          METIS_MIGRATION_URL="$METIS_TEST_PG_URI" python -m backend.core.migrate
          METIS_MIGRATION_URL="$METIS_TEST_PG_URI" python -m backend.core.migrate
      - run: python -m pytest -q
  secrets-and-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --no-banner
      - name: trivy fs scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
