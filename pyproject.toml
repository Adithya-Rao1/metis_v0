[project]
name = "metis"
version = "0.1.0"
description = "Metis v1 backend"
requires-python = ">=3.12"

# pytest is configured in pytest.ini (takes precedence over this file).

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", ".tmpvenv", "web", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608", "E501", "B017"]
# Narrow per-file ignores for modules owned by other agents (F-110). Each entry lists only the rules that
# fire today; fix at the source and delete the entry. B008 = FastAPI Depends()/Query() defaults (idiomatic);
# E501 = lines up to ~130 chars; UP045/UP037/UP035/UP017/I001/B905 = style modernisation; the rest are
# single real findings (E741 ambiguous name, E702 semicolons, E731 lambda, F401/F841 unused, B023 loop var,
# SIM105/SIM300, S603 = sandbox subprocess with fixed argv and env={}). dockprep/* still carries its own
# in-file "ruff: noqa" headers (not owned here), so ruff skips those files entirely.
"backend/compounds/routes.py" = ["B008", "E501", "UP045"]
"backend/compounds/sandbox.py" = ["S603"]
"backend/compounds/standardize.py" = ["E501"]
"backend/compounds/worker.py" = ["E501", "SIM105"]
"backend/accounts/deps.py" = ["E501", "S311"]
"backend/accounts/hardening.py" = ["E501", "SIM102"]
"backend/accounts/router.py" = ["E501"]
"backend/accounts/security.py" = ["SIM905"]
"ml/registry/sync_db.py" = ["E501"]
"backend/dockprep/sandbox.py" = ["I001"]
"backend/exports/formats.py" = ["E501", "UP045"]
"backend/exports/routes.py" = ["B008", "B905", "E501"]
"backend/jobs/deps.py" = ["B008", "E501"]
"backend/jobs/queue.py" = ["E501", "UP017", "UP045"]
"backend/predictions/routes.py" = ["B008", "E501"]
"backend/projects/routes.py" = ["B008", "E501", "UP045"]
"backend/ranking/engine.py" = ["B905", "E501", "UP045"]
"backend/ranking/service.py" = ["E501", "UP045"]
"backend/schemas/contracts.py" = ["E501", "E741", "UP045"]
"backend/schemas/interfaces.py" = ["E501", "UP045"]
"ml/benchmarks/protocol.py" = ["B023", "E501", "F401", "I001"]
"ml/data/cards.py" = ["E501"]
"ml/data/clean.py" = ["I001"]
"ml/data/loader.py" = ["I001"]
"ml/data/manifest.py" = ["E501"]
"ml/data/splits.py" = ["B905"]
"ml/registry/predictor.py" = ["E501", "F841"]
"ml/registry/publish.py" = ["E501", "I001"]
"ml/registry/registry.py" = ["E501"]
"ml/train/bundle.py" = ["B905", "E501", "I001", "UP037"]
"ml/train/chemprop_member.py" = ["B905", "E501", "I001"]
"ml/train/ensemble.py" = ["E501", "UP035", "UP037"]
"ml/train/member.py" = ["E501", "I001", "UP037"]
"ml/train/train_endpoint.py" = ["B905", "E501", "E702", "F401", "I001", "UP035"]
"ml/uncertainty/attribution.py" = ["E501", "E731", "UP035"]
"ml/uncertainty/conformal.py" = ["B905", "E501", "SIM300", "UP037"]
"ml/uncertainty/decompose.py" = ["E501"]
"ml/uncertainty/similarity.py" = ["UP037"]

[tool.mypy]
python_version = "3.12"
files = ["backend", "ml"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
# Narrow per-module overrides below: modules owned by other agents with pre-existing findings (F-110).

[[tool.mypy.overrides]]
module = "backend.accounts.hardening"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "backend.accounts.deps"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "backend.compounds.standardize"
disable_error_code = ["assignment", "attr-defined"]

[[tool.mypy.overrides]]
module = "backend.compounds.worker"
disable_error_code = ["arg-type", "union-attr"]

[[tool.mypy.overrides]]
module = "backend.dockprep.auth"
disable_error_code = ["unused-ignore"]

[[tool.mypy.overrides]]
module = "backend.dockprep.ligand"
disable_error_code = ["assignment", "attr-defined"]

[[tool.mypy.overrides]]
module = "backend.dockprep.pockets"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "backend.dockprep.protein"
disable_error_code = ["unused-ignore"]

[[tool.mypy.overrides]]
module = "backend.dockprep.sites"
disable_error_code = ["arg-type", "assignment"]

[[tool.mypy.overrides]]
module = "backend.exports.formats"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "backend.jobs.deps"
disable_error_code = ["unused-ignore"]

[[tool.mypy.overrides]]
module = "backend.jobs.queue"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "backend.predictions.routes"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "backend.projects.routes"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "backend.schemas.contracts"
disable_error_code = ["assignment", "operator"]

[[tool.mypy.overrides]]
module = "ml.data.baselines"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "ml.data.clean"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "ml.data.manifest"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "ml.data.splits"
disable_error_code = ["attr-defined", "var-annotated"]

[[tool.mypy.overrides]]
module = "ml.registry.predictor"
disable_error_code = ["arg-type", "union-attr"]

[[tool.mypy.overrides]]
module = "ml.registry.publish"
disable_error_code = ["index", "arg-type"]

[[tool.mypy.overrides]]
module = "ml.train.ensemble"
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = "ml.train.train_endpoint"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "ml.uncertainty.attribution"
disable_error_code = ["arg-type", "attr-defined", "type-var"]

[[tool.mypy.overrides]]
module = "ml.uncertainty.conformal"
disable_error_code = ["arg-type", "union-attr"]

[[tool.mypy.overrides]]
module = "ml.uncertainty.similarity"
disable_error_code = ["attr-defined"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".tmpvenv", "web"]
# B311: random.random() is used only to sample opportunistic bucket purging in backend/accounts/deps.py (not
# security relevant). Replace with a nosec comment at the source and drop this skip.
skips = ["B311"]
