# Keep gitleaks' default rules; allow only the two deliberately fake values that appear in early test history
# (they are in commits before they were replaced with obviously fake ones). Never add real values here.
[extend]
useDefault = true

[allowlist]
description = "fake fixtures in tests/foundation (test_wave1_fixes.py, test_settings.py) and tests/security/test_wave1_redteam.py"
regexes = [
  '''Short-Secret-Key-Value''',
  '''RedisPw77''',
  '''sk7d9s8a6f5g4h3j''',
]
