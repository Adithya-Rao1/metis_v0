# Local/dev stack. Requires deploy/.env (copy from .env.example and fill in values).
# Run from repo root:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
# The metis_app_db login role (member of metis_app) must be created by deploy tooling after migration;
# see docs/DB_SCHEMA.md. METIS_APP_DB_PASSWORD is for that step.
services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: metis_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: metis
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metis_owner -d metis"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  migrate:
    build: {context: .., dockerfile: deploy/Dockerfile}
    command: ["python", "-m", "backend.core.migrate"]
    environment:  # owner credentials live only in this one-shot job
      METIS_MIGRATION_URL: ${METIS_MIGRATION_URL:?set METIS_MIGRATION_URL}
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--save", ""]
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${METIS_OBJECT_STORE_ACCESS_KEY:?set METIS_OBJECT_STORE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${METIS_OBJECT_STORE_SECRET_KEY:?set METIS_OBJECT_STORE_SECRET_KEY}
    volumes: [miniodata:/data]
    networks: [backend]

  app:
    build: {context: .., dockerfile: deploy/Dockerfile}
    # Explicit allow-list: the app never receives POSTGRES_PASSWORD, METIS_MIGRATION_URL (schema owner),
    # METIS_APP_DB_PASSWORD or REDIS_PASSWORD. Values are interpolated from deploy/.env by compose only.
    environment:
      METIS_ENV: ${METIS_ENV:-production}
      METIS_DATABASE_URL: ${METIS_DATABASE_URL:?set METIS_DATABASE_URL (metis_app_login role)}
      METIS_SECRET_KEY: ${METIS_SECRET_KEY:?set METIS_SECRET_KEY}
      METIS_REDIS_URL: ${METIS_REDIS_URL:?set METIS_REDIS_URL}
      METIS_OBJECT_STORE_ENDPOINT: ${METIS_OBJECT_STORE_ENDPOINT:?set METIS_OBJECT_STORE_ENDPOINT}
      METIS_OBJECT_STORE_ACCESS_KEY: ${METIS_OBJECT_STORE_ACCESS_KEY:?set METIS_OBJECT_STORE_ACCESS_KEY}
      METIS_OBJECT_STORE_SECRET_KEY: ${METIS_OBJECT_STORE_SECRET_KEY:?set METIS_OBJECT_STORE_SECRET_KEY}
      METIS_OBJECT_STORE_BUCKET: ${METIS_OBJECT_STORE_BUCKET:-metis}
      # Client-IP handling for rate limits. Default false: the socket peer address is used. Set to "true" ONLY
      # when the app is reachable exclusively through your own reverse proxy that appends the real client IP as
      # the LAST X-Forwarded-For hop (only that last hop is trusted). If the proxy is in front and this stays
      # false, every client shares the proxy IP and the per-IP login/register limits lock everyone out together.
      METIS_ACCOUNTS_TRUST_PROXY: ${METIS_ACCOUNTS_TRUST_PROXY:-false}
    ports: ["127.0.0.1:8000:8000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
      minio: {condition: service_started}
    networks: [backend]

volumes:
  pgdata: {}
  miniodata: {}

networks:
  backend: {}
